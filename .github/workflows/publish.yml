name: Publish Package

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI used for trusted publishing
        run: npm install --global npm@11.18.0 --ignore-scripts

      - name: Verify release gate issue is closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/5" --jq .state)"
          if [[ "$state" != "closed" ]]; then
            echo "Release blocker #5 is still open; refusing to publish." >&2
            exit 1
          fi

      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag does not point to a commit contained in main." >&2
            exit 1
          fi

      - name: Verify tag, version, and npm bootstrap state
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"

          if [[ "$tag" != "v${version}" ]]; then
            echo "Release tag '$tag' must exactly match package version 'v${version}'." >&2
            exit 1
          fi

          if ! npm view "$package_name" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Package '$package_name' does not exist on npm yet." >&2
            echo "Trusted Publishing cannot bootstrap a brand-new package; follow docs/releasing.md first-publish steps." >&2
            exit 1
          fi

          case "$version" in
            *-alpha|*-alpha.*) dist_tag="alpha" ;;
            *-beta|*-beta.*) dist_tag="beta" ;;
            *-rc|*-rc.*) dist_tag="rc" ;;
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac

          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "Publishing $package_name@$version with dist-tag '$dist_tag'."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm with Trusted Publishing
        run: npm publish --access public --tag "$DIST_TAG" --provenance
